name: WeChat Taffy mobile title Grid feasibility
on:
  push:
    paths:
      - 'platforms/wechat/vendor-eval/taffy-title-grid-*'
      - '.github/workflows/wechat-taffy-layout.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/checkout@v4
        with:
          repository: yixuanqi/PhotoGallery
          ref: cdb508594cc610733f248ec5d4123a3b9d954981
          path: upstream
          sparse-checkout: docs/ashen-bell-vow
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: DioxusLabs/taffy
          ref: 497de49c200daee81a18ce627bec98d5340ae57a
          path: vendor-taffy
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          targets: wasm32-unknown-unknown
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node platforms/wechat/vendor-eval/taffy-title-grid-spike.mjs upstream vendor-taffy
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wechat-taffy-mobile-title-grid-NOT-RELEASE
          path: .work/wechat-taffy-052g/evidence/
          if-no-files-found: warn
          retention-days: 14
