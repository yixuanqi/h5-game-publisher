name: WeChat DOM semantics candidate feasibility
on:
  push:
    paths:
      - 'platforms/wechat/vendor-eval/linkedom-dom-spike.mjs'
      - '.github/workflows/wechat-dom-semantics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/checkout@v4
        with:
          repository: yixuanqi/PhotoGallery
          ref: cdb508594cc610733f248ec5d4123a3b9d954981
          path: upstream
          sparse-checkout: docs/ashen-bell-vow
          persist-credentials: false
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund esbuild@0.25.12 linkedom@0.18.15
      - run: node platforms/wechat/vendor-eval/linkedom-dom-spike.mjs upstream
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wechat-linkedom-dom-semantics-NOT-RELEASE
          path: .work/wechat-linkedom-052e/evidence/
          if-no-files-found: warn
          retention-days: 14
