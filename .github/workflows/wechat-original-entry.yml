name: WeChat original H5 entry V0.5.2f (not release)
on:
  push:
    paths:
      - 'platforms/wechat/original-entry/**'
      - 'platforms/wechat/runtime/**'
      - 'platforms/wechat/bootstrap/runtime.cjs'
      - 'platforms/wechat/bootstrap/compatibility.json'
      - 'tests/wechat-browser-basics.test.mjs'
      - 'tests/wechat-url-search-params.test.mjs'
      - 'tests/wechat-wx-dom-canvas.test.mjs'
      - 'tests/wechat-viewport-bridge.test.mjs'
      - 'tests/wechat-browser-environment.test.mjs'
      - '.github/workflows/wechat-original-entry.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-original-entry:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/wechat-browser-basics.test.mjs tests/wechat-url-search-params.test.mjs tests/wechat-wx-dom-canvas.test.mjs tests/wechat-viewport-bridge.test.mjs tests/wechat-browser-environment.test.mjs
      - uses: actions/checkout@v4
        with:
          repository: yixuanqi/PhotoGallery
          ref: cdb508594cc610733f248ec5d4123a3b9d954981
          path: upstream
          sparse-checkout: docs/ashen-bell-vow
          persist-credentials: false
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund esbuild@0.25.12 linkedom@0.18.15
      - run: node platforms/wechat/original-entry/build.mjs upstream touristappid
      - run: node --check .work/wechat-original-entry-052f/project/game.js && node --check .work/wechat-original-entry-052f/project/host.js && node --check .work/wechat-original-entry-052f/project/engine.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wechat-original-entry-052f-NOT-RELEASE
          path: |
            .work/wechat-original-entry-052f/project/
            .work/wechat-original-entry-052f/build-info.json
          if-no-files-found: warn
          retention-days: 14
