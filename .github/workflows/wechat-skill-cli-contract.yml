name: WeChat Skill CLI contract (not official runtime)
on:
  push:
    paths:
      - 'platforms/wechat/skill-cli/**'
      - 'tests/wechat-skill-cli.test.mjs'
      - 'tests/wechat-canvas-official.test.mjs'
      - '.github/workflows/wechat-skill-cli-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check platforms/wechat/skill-cli/probe.mjs
      - run: node --test tests/wechat-skill-cli.test.mjs tests/wechat-canvas-official.test.mjs
