name: WeChat helper game diagnostics V0.5.1b
on:
  push:
    paths:
      - 'platforms/wechat/helper/preview-session.mjs'
      - 'platforms/wechat/helper/game-probe.mjs'
      - 'platforms/wechat/helper/interaction-fixture/**'
      - '.github/workflows/wechat-helper-game.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        mode: [control, frozen-game]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download frozen project (not release)
        if: matrix.mode == 'frozen-game'
        uses: actions/download-artifact@v4
        with:
          name: ashen-v46.1-wechat-V0.4.4-project-NOT-FOR-RELEASE
          run-id: 45825728399
          github-token: ${{ github.token }}
          path: .work/wechat-helper-051b/input/project
      - name: Download matching build evidence
        if: matrix.mode == 'frozen-game'
        uses: actions/download-artifact@v4
        with:
          name: ashen-v46.1-wechat-V0.4.4-test-report
          run-id: 45825728399
          github-token: ${{ github.token }}
          path: .work/wechat-helper-051b/input/evidence
      - run: npm install --prefix platforms/wechat/helper --ignore-scripts --no-audit --no-fund
      - run: platforms/wechat/helper/node_modules/.bin/playwright install --with-deps chromium
      - name: Execute preview diagnostic and check unchanged input
        run: node platforms/wechat/helper/game-probe.mjs ${{ matrix.mode }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wechat-helper-051b-${{ matrix.mode }}-diagnostics-NOT-RELEASE
          path: .work/wechat-helper-051b/${{ matrix.mode }}/
          if-no-files-found: warn
          retention-days: 14
