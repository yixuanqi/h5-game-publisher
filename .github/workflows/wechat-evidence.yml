name: WeChat evidence contract
on:
  push:
    branches: [main]
    paths:
      - 'platforms/wechat/**'
      - '.github/workflows/wechat-evidence.yml'
  workflow_dispatch:
    inputs:
      game:
        type: choice
        options: [ashen-bell-vow, curio-box]
        required: true
      candidate_run_id:
        description: Successful real WeChat candidate workflow run ID
        type: string
        required: true
      candidate_artifact_id:
        description: Exact candidate input artifact ID
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  contract-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.1.0
      - run: python -m unittest discover -s platforms/wechat -p 'test_*.py' -v
  verify-real-candidate:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: contract-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.1.0
      - name: Verify exact real candidate artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GAME: ${{ inputs.game }}
          RUN_ID: ${{ inputs.candidate_run_id }}
          ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
        run: python platforms/wechat/promote_evidence.py --game "$GAME" --run-id "$RUN_ID" --artifact-id "$ARTIFACT_ID" --out "$RUNNER_TEMP/verified-evidence"
      - uses: actions/upload-artifact@v4
        with:
          name: wechat-evidence-${{ inputs.game }}-${{ github.run_id }}
          path: ${{ runner.temp }}/verified-evidence/
          retention-days: 30
          if-no-files-found: error
