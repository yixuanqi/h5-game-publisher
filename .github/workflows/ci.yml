name: Framework checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      android_api:
        description: Android emulator API level
        type: choice
        options: ['29', '34', '36']
        default: '34'
permissions:
  contents: read
jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node scripts/publisher.mjs prepare configs/demo.json
  real-game-staging:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/checkout@v4
        with:
          repository: yixuanqi/PhotoGallery
          ref: 5cc1493798b6007c303019003768474bf865c547
          path: upstream
          sparse-checkout: |
            docs/ashen-bell-vow
            docs/curio-box
          persist-credentials: false
      - run: |
          for game in ashen-bell-vow curio-box; do
            node scripts/import-blog.mjs "$game" upstream
            node scripts/publisher.mjs prepare "configs/$game.json"
          done
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/browser-smoke.mjs
  android-smoke:
    runs-on: ubuntu-24.04
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        game: [demo, ashen-bell-vow, curio-box]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - if: matrix.game != 'demo'
        uses: actions/checkout@v4
        with:
          repository: yixuanqi/PhotoGallery
          ref: 5cc1493798b6007c303019003768474bf865c547
          path: upstream
          sparse-checkout: |
            docs/ashen-bell-vow
            docs/curio-box
          persist-credentials: false
      - if: matrix.game != 'demo'
        run: node scripts/import-blog.mjs "${{ matrix.game }}" upstream
      # GitHub Ubuntu runners include Android SDK; avoid deprecated sdkmanager tools package.
      - name: Ensure SDK 36
        run: |
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$sdk"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          if [ -f "$sdk/platforms/android-36/android.jar" ] && [ -x "$sdk/build-tools/36.0.0/aapt2" ]; then
            echo 'SDK 36 already installed'
          else
            manager="$(find "$sdk/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)"
            test -x "$manager"
            "$manager" --sdk_root="$sdk" 'platforms;android-36' 'build-tools;36.0.0'
          fi
          test -f "$sdk/platforms/android-36/android.jar"
          test -x "$sdk/build-tools/36.0.0/aapt2"
      - run: node scripts/publisher.mjs apk "configs/${{ matrix.game }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.game }}-apk
          path: |
            dist/${{ matrix.game }}/**/*.apk
            dist/${{ matrix.game }}/**/*.apk.sha256
            dist/${{ matrix.game }}/**/build-info.json
          if-no-files-found: error
      - run: node scripts/publisher.mjs aab "configs/${{ matrix.game }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.game }}-aab
          path: |
            dist/${{ matrix.game }}/**/*.aab
            dist/${{ matrix.game }}/**/*.aab.sha256
            dist/${{ matrix.game }}/**/build-info.json
            dist/${{ matrix.game }}/**/package-lock.json
          if-no-files-found: error

  android-emulator:
    runs-on: ubuntu-24.04
    needs: android-smoke
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        game: [demo, ashen-bell-vow, curio-box]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.game }}-apk
          path: emulator-input
      - name: Enable KVM and SDK paths
        run: |
          test -c /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          manager="$(find "$sdk/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)"
          test -x "$manager"
          printf '%s\n' "$(dirname "$manager")" "$sdk/platform-tools" "$sdk/emulator" >> "$GITHUB_PATH"
          mkdir -p emulator-report
      - name: Install and exercise exact CI APK
        uses: reactivecircus/android-emulator-runner@v2.35.0
        with:
          api-level: ${{ inputs.android_api || '34' }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: node scripts/emulator-smoke.mjs configs/${{ matrix.game }}.json emulator-input emulator-report
      - name: Archive emulator evidence (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.game }}-emulator-api-${{ inputs.android_api || '34' }}
          path: emulator-report/
          if-no-files-found: warn
