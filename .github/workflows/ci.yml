name: Framework checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      android_api:
        description: Android emulator API level
        type: choice
        options: ['29', '34', '36']
        default: '34'
      android_image:
        description: Android image target (AOSP default; Google APIs optional compatibility)
        type: choice
        options: ['default', 'google_apis']
        default: 'default'
      android_gpu:
        description: Emulator software graphics backend
        type: choice
        options: ['swangle', 'software', 'swiftshader', 'lavapipe']
        default: 'swangle'
      reload_stress:
        description: Extra in-page WebView reload stress (separate from normal boot/relaunch)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node scripts/publisher.mjs prepare configs/demo.json
  real-game-staging:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/checkout@v4
        with:
          repository: yixuanqi/PhotoGallery
          ref: 5cc1493798b6007c303019003768474bf865c547
          path: upstream
          sparse-checkout: |
            docs/ashen-bell-vow
            docs/curio-box
          persist-credentials: false
      - run: |
          for game in ashen-bell-vow curio-box; do
            node scripts/import-blog.mjs "$game" upstream
            node scripts/publisher.mjs prepare "configs/$game.json"
          done
      - run: node scripts/check-baseline.mjs upstream
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/browser-smoke.mjs
      - name: Verify original sources and raw exports
        if: always()
        run: node scripts/verify-upstream.mjs upstream ashen-bell-vow curio-box
  android-smoke:
    runs-on: ubuntu-24.04
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        game: [demo, ashen-bell-vow, curio-box]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - if: matrix.game != 'demo'
        uses: actions/checkout@v4
        with:
          repository: yixuanqi/PhotoGallery
          ref: 5cc1493798b6007c303019003768474bf865c547
          path: upstream
          sparse-checkout: |
            docs/ashen-bell-vow
            docs/curio-box
          persist-credentials: false
      - if: matrix.game != 'demo'
        run: node scripts/import-blog.mjs "${{ matrix.game }}" upstream
      # GitHub Ubuntu runners include Android SDK; avoid deprecated sdkmanager tools package.
      - name: Ensure SDK 36
        run: |
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$sdk"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          if [ -f "$sdk/platforms/android-36/android.jar" ] && [ -x "$sdk/build-tools/36.0.0/aapt2" ]; then
            echo 'SDK 36 already installed'
          else
            manager="$(find "$sdk/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)"
            test -x "$manager"
            "$manager" --sdk_root="$sdk" 'platforms;android-36' 'build-tools;36.0.0'
          fi
          test -f "$sdk/platforms/android-36/android.jar"
          test -x "$sdk/build-tools/36.0.0/aapt2"
      - name: Install verified bundletool
        shell: bash
        run: |
          set -euo pipefail
          policy=platforms/android/quality-policy.json
          url="$(node -p 'require("./"+process.argv[1]).bundletool.url' "$policy")"
          hash="$(node -p 'require("./"+process.argv[1]).bundletool.sha256' "$policy")"
          jar="$RUNNER_TEMP/bundletool.jar"
          curl --fail --location --retry 3 --output "$jar" "$url"
          printf '%s  %s\n' "$hash" "$jar" | sha256sum --check
          echo "H5_BUNDLETOOL_JAR=$jar" >> "$GITHUB_ENV"
      - run: node scripts/publisher.mjs apk "configs/${{ matrix.game }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.game }}-apk
          path: |
            dist/${{ matrix.game }}/**/*.apk
            dist/${{ matrix.game }}/**/*.apk.sha256
            dist/${{ matrix.game }}/**/build-info.json
          if-no-files-found: error
      - run: node scripts/publisher.mjs aab "configs/${{ matrix.game }}.json"
      - name: Validate unsigned AAB structure, manifest and runtime assets
        shell: bash
        run: |
          set -euo pipefail
          game="${{ matrix.game }}"
          aab="$(find "dist/$game" -name '*-unsigned.aab' -type f)"
          node platforms/android/validate-aab.mjs "$aab" "configs/$game.json" "$H5_BUNDLETOOL_JAR"

      - name: Verify AAB signing with disposable test key (demo only)
        if: matrix.game == 'demo'
        shell: bash
        run: |
          set -euo pipefail
          export H5_SIGNING_MODE=test H5_KEY_ALIAS=ci-test
          export H5_STORE_PASSWORD="$(openssl rand -hex 24)"
          export H5_KEY_PASSWORD="$H5_STORE_PASSWORD"
          echo "::add-mask::$H5_STORE_PASSWORD"
          temp="$(mktemp -d)"
          trap 'rm -rf "$temp"' EXIT
          export H5_KEYSTORE="$temp/test.p12"
          keytool -genkeypair -alias "$H5_KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 365 -dname 'CN=CI Disposable Test Only' -storetype PKCS12 -keystore "$H5_KEYSTORE" -storepass:env H5_STORE_PASSWORD -keypass:env H5_KEY_PASSWORD
          keytool -exportcert -alias "$H5_KEY_ALIAS" -keystore "$H5_KEYSTORE" -storepass:env H5_STORE_PASSWORD -file "$temp/cert.der"
          export H5_UPLOAD_CERT_SHA256="$(sha256sum "$temp/cert.der" | cut -d' ' -f1)"
          unsigned="$(find dist/demo -name '*-unsigned.aab' -type f)"
          if H5_UPLOAD_CERT_SHA256="$(printf '%064d' 0)" node platforms/android/sign-aab.mjs "$unsigned"; then
            echo 'Wrong signer pin was accepted'; exit 1
          fi
          test ! -e "${unsigned%-unsigned.aab}-test-signed.aab"
          node platforms/android/sign-aab.mjs "$unsigned"
          signed="${unsigned%-unsigned.aab}-test-signed.aab"
          test -s "$signed"
          node platforms/android/validate-aab.mjs "$signed" configs/demo.json "$H5_BUNDLETOOL_JAR"

          if node platforms/android/sign-aab.mjs "$unsigned"; then
            echo 'Existing signed artifact was overwritten'; exit 1
          fi
          mkdir -p signing-report
          cp "$signed.signing.json" "$signed.validation.json" signing-report/
          rm -- "$signed" "$signed.sha256" "$signed.signing.json" "$signed.validation.json"
      - name: Archive signing validation evidence
        if: matrix.game == 'demo'
        uses: actions/upload-artifact@v4
        with:
          name: demo-signing-report
          path: signing-report/
          if-no-files-found: error
      - name: Verify original source after APK and AAB builds
        if: always() && matrix.game != 'demo'
        run: node scripts/verify-upstream.mjs upstream "${{ matrix.game }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.game }}-aab
          path: |
            dist/${{ matrix.game }}/**/*.aab
            dist/${{ matrix.game }}/**/*.aab.sha256
            dist/${{ matrix.game }}/**/build-info.json
            dist/${{ matrix.game }}/**/package-lock.json
            dist/${{ matrix.game }}/**/*-unsigned.aab.validation.json
          if-no-files-found: error

  android-emulator:
    runs-on: ubuntu-24.04
    needs: android-smoke
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        game: [demo, ashen-bell-vow, curio-box]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.game }}-apk
          path: emulator-input
      - name: Enable KVM and SDK paths
        run: |
          test -c /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          manager="$(find "$sdk/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)"
          test -x "$manager"
          printf '%s\n' "$(dirname "$manager")" "$sdk/platform-tools" "$sdk/emulator" >> "$GITHUB_PATH"
          mkdir -p emulator-report
      - name: Install and exercise exact CI APK
        env:
          H5_RELOAD_STRESS: ${{ inputs.reload_stress || false }}
        uses: reactivecircus/android-emulator-runner@v2.35.0
        with:
          api-level: ${{ inputs.android_api || '34' }}
          target: ${{ inputs.android_image || 'default' }}
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu ${{ inputs.android_gpu || 'swangle' }} -feature -Vulkan -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: node scripts/emulator-smoke.mjs configs/${{ matrix.game }}.json emulator-input emulator-report
      - name: Capture host diagnostics (including emulator termination)
        if: always()
        shell: bash
        run: |
          mkdir -p emulator-report
          {
            date -u
            free -h
            df -h
            lscpu
            cat /proc/pressure/memory || true
            cat /sys/fs/cgroup/memory.events || true
            emulator -version || true
            sudo journalctl -k --no-pager -n 100 || true
            sudo journalctl --no-pager -n 100 | grep -Ei 'apport|qemu|segfault|oom|core dump' || true
            sudo ls -lh /var/crash || true
            ps -eo pid,comm,rss,%cpu --sort=-rss | head -n 25 || true
            timeout 10s adb devices -l || true
          } > emulator-report/host-diagnostics.txt 2>&1
          sudo dmesg -T | tail -n 250 > emulator-report/host-kernel-tail.txt 2>&1 || true
      - name: Archive emulator evidence (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.game }}-emulator-api-${{ inputs.android_api || '34' }}-${{ inputs.android_image || 'default' }}
          path: emulator-report/
          if-no-files-found: warn
