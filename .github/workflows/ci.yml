name: Framework checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node scripts/publisher.mjs prepare configs/demo.json
  real-game-staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/checkout@v4
        with:
          repository: yixuanqi/PhotoGallery
          ref: 5cc1493798b6007c303019003768474bf865c547
          path: upstream
          sparse-checkout: |
            docs/ashen-bell-vow
            docs/curio-box
          persist-credentials: false
      - run: |
          for game in ashen-bell-vow curio-box; do
            node scripts/import-blog.mjs "$game" upstream
            node scripts/publisher.mjs prepare "configs/$game.json"
          done
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/browser-smoke.mjs
  android-smoke:
    runs-on: ubuntu-latest
    needs: [unit, real-game-staging]
    strategy:
      fail-fast: false
      matrix:
        game: [demo, ashen-bell-vow, curio-box]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - if: matrix.game != 'demo'
        uses: actions/checkout@v4
        with:
          repository: yixuanqi/PhotoGallery
          ref: 5cc1493798b6007c303019003768474bf865c547
          path: upstream
          sparse-checkout: |
            docs/ashen-bell-vow
            docs/curio-box
          persist-credentials: false
      - if: matrix.game != 'demo'
        run: node scripts/import-blog.mjs "${{ matrix.game }}" upstream
      # GitHub Ubuntu runners include Android SDK; avoid deprecated sdkmanager tools package.
      - name: Ensure SDK 36
        run: |
          test -n "$ANDROID_HOME"
          sdkmanager --version
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: node scripts/publisher.mjs apk "configs/${{ matrix.game }}.json"
      - run: node scripts/publisher.mjs aab "configs/${{ matrix.game }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.game }}-android
          path: dist/${{ matrix.game }}/
          if-no-files-found: error
