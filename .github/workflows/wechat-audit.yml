name: WeChat V0.5.2a source audit and H5 baseline
on:
  push:
    paths:
      - 'platforms/wechat/audit/**'
      - 'tests/wechat-audit.test.mjs'
      - '.github/workflows/wechat-audit.yml'
      - 'docs/WECHAT-RUNTIME-052.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/wechat-audit.test.mjs
      - uses: actions/checkout@v4
        with:
          repository: yixuanqi/PhotoGallery
          ref: cdb508594cc610733f248ec5d4123a3b9d954981
          path: upstream
          sparse-checkout: docs/ashen-bell-vow
          persist-credentials: false
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund esbuild@0.25.12 acorn@8.15.0 linkedom@0.18.12 playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node --check platforms/wechat/audit/run.mjs
      - run: node platforms/wechat/audit/run.mjs upstream
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wechat-052a-audit-and-h5-baseline-NOT-RELEASE
          path: .work/wechat-audit-052a/evidence/
          if-no-files-found: warn
          retention-days: 14
