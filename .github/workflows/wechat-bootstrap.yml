name: WeChat bootstrap V46.1 (not release)
on:
  push:
    paths:
      - 'platforms/wechat/bootstrap/**'
      - 'tests/wechat-bootstrap.test.mjs'
      - '.github/workflows/wechat-bootstrap.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Platform unit checks
        run: node --test tests/wechat-bootstrap.test.mjs
      - uses: actions/checkout@v4
        with:
          repository: yixuanqi/PhotoGallery
          ref: cdb508594cc610733f248ec5d4123a3b9d954981
          path: upstream
          sparse-checkout: docs/ashen-bell-vow
          persist-credentials: false
      - run: npm install --no-save --no-package-lock esbuild@0.25.12
      - name: Build diagnostic project using actual V46.1
        run: node platforms/wechat/bootstrap/build.mjs upstream
      - name: Run real game loader under wx mock
        run: node platforms/wechat/bootstrap/smoke.mjs
      - name: Upload private diagnostic only
        uses: actions/upload-artifact@v4
        with:
          name: ashen-v46.1-wechat-bootstrap-NOT-FOR-RELEASE
          path: |
            .work/wechat-bootstrap-46.1/project/
            .work/wechat-bootstrap-46.1/build-info.json
            .work/wechat-bootstrap-46.1/smoke-report.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
