name: Android release candidate
on:
  workflow_dispatch:
    inputs:
      game:
        description: Game to prepare
        type: choice
        options: [ashen-bell-vow, curio-box, demo]
        required: true
      ci_run_id:
        description: Fresh all-green Framework checks run ID on this exact main commit
        type: string
        required: true
      approved_aab_sha256:
        description: Exact unsigned AAB SHA256 from release-evidence.json
        type: string
        required: true
      mode:
        description: Rehearsal (disposable key) or upload-key signing (no store upload)
        type: choice
        options: [rehearsal, upload]
        default: rehearsal
      confirmation:
        description: For upload mode only, type SIGN UPLOAD AAB
        type: string
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: android-release-${{ inputs.game }}
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact successful CI run and explicit approval
        env:
          GH_TOKEN: ${{ github.token }}
          GAME: ${{ inputs.game }}
          RUN_ID: ${{ inputs.ci_run_id }}
          APPROVED: ${{ inputs.approved_aab_sha256 }}
          MODE: ${{ inputs.mode }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [ "$MODE" = upload ]; then test "$CONFIRMATION" = 'SIGN UPLOAD AAB'; fi
          node platforms/android/release-preflight.mjs run "$GAME" "$RUN_ID" "$GITHUB_SHA" "$APPROVED" "$MODE"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.game }}-apk
          path: candidate/apk
          github-token: ${{ github.token }}
          run-id: ${{ inputs.ci_run_id }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.game }}-aab
          path: candidate/aab
          github-token: ${{ github.token }}
          run-id: ${{ inputs.ci_run_id }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.game }}-upgrade-test-apk
          path: candidate/upgrade
          github-token: ${{ github.token }}
          run-id: ${{ inputs.ci_run_id }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.game }}-emulator-api-34-default
          path: candidate/report
          github-token: ${{ github.token }}
          run-id: ${{ inputs.ci_run_id }}
      - name: Bind exact artifacts (no rebuild)
        env:
          GAME: ${{ inputs.game }}
          RUN_ID: ${{ inputs.ci_run_id }}
          APPROVED: ${{ inputs.approved_aab_sha256 }}
          MODE: ${{ inputs.mode }}
        run: node platforms/android/release-preflight.mjs artifacts "$GAME" "$RUN_ID" "$GITHUB_SHA" "$APPROVED" "$MODE"
      - uses: actions/upload-artifact@v4
        with:
          name: approved-release-input
          path: dist/
          if-no-files-found: error
          retention-days: 7
  rehearsal:
    if: inputs.mode == 'rehearsal'
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/download-artifact@v4
        with:
          name: approved-release-input
          path: dist
      - name: Install pinned bundletool
        shell: bash
        run: |
          set -euo pipefail
          policy=platforms/android/quality-policy.json
          url="$(node -p 'require("./"+process.argv[1]).bundletool.url' "$policy")"
          hash="$(node -p 'require("./"+process.argv[1]).bundletool.sha256' "$policy")"
          jar="$RUNNER_TEMP/bundletool.jar"
          curl --fail --location --retry 3 --output "$jar" "$url"
          printf '%s  %s\n' "$hash" "$jar" | sha256sum --check
          echo "H5_BUNDLETOOL_JAR=$jar" >> "$GITHUB_ENV"
      - name: Verify approved unsigned bundle again
        env:
          GAME: ${{ inputs.game }}
          APPROVED: ${{ inputs.approved_aab_sha256 }}
        run: |
          set -euo pipefail
          aab="$(find "dist/$GAME" -name '*-unsigned.aab' -type f)"
          test "$(sha256sum "$aab" | cut -d' ' -f1)" = "$APPROVED"
          node platforms/android/validate-aab.mjs "$aab" "configs/$GAME.json" "$H5_BUNDLETOOL_JAR"
      - name: Rehearse candidate signing with disposable key only
        env:
          GAME: ${{ inputs.game }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          temp="$(mktemp -d "$RUNNER_TEMP/rehearsal.XXXXXX")"
          trap 'rm -rf "$temp"' EXIT
          export H5_SIGNING_MODE=test H5_KEY_ALIAS=release-rehearsal
          export H5_STORE_PASSWORD="$(openssl rand -hex 24)"
          export H5_KEY_PASSWORD="$H5_STORE_PASSWORD"
          echo "::add-mask::$H5_STORE_PASSWORD"
          export H5_KEYSTORE="$temp/test.p12"
          keytool -genkeypair -alias "$H5_KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 365 -dname 'CN=Release Rehearsal Only' -storetype PKCS12 -keystore "$H5_KEYSTORE" -storepass:env H5_STORE_PASSWORD -keypass:env H5_KEY_PASSWORD
          keytool -exportcert -alias "$H5_KEY_ALIAS" -keystore "$H5_KEYSTORE" -storepass:env H5_STORE_PASSWORD -file "$temp/cert.der"
          export H5_UPLOAD_CERT_SHA256="$(sha256sum "$temp/cert.der" | cut -d' ' -f1)"
          aab="$(find "dist/$GAME" -name '*-unsigned.aab' -type f)"
          node platforms/android/sign-aab.mjs "$aab"
          signed="${aab%-unsigned.aab}-test-signed.aab"
          node platforms/android/validate-aab.mjs "$signed" "configs/$GAME.json" "$H5_BUNDLETOOL_JAR"
          mkdir -p rehearsal-report
          cp "$signed.signing.json" "$signed.validation.json" "$(dirname "$aab")/release-evidence.json" rehearsal-report/
          rm -- "$signed" "$signed.sha256" "$signed.signing.json" "$signed.validation.json"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.game }}-rehearsal-report
          path: rehearsal-report/
          if-no-files-found: error
  sign-upload:
    if: inputs.mode == 'upload'
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: android-upload-${{ inputs.game }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/download-artifact@v4
        with:
          name: approved-release-input
          path: dist
      - name: Install pinned bundletool
        shell: bash
        run: |
          set -euo pipefail
          policy=platforms/android/quality-policy.json
          url="$(node -p 'require("./"+process.argv[1]).bundletool.url' "$policy")"
          hash="$(node -p 'require("./"+process.argv[1]).bundletool.sha256' "$policy")"
          jar="$RUNNER_TEMP/bundletool.jar"
          curl --fail --location --retry 3 --output "$jar" "$url"
          printf '%s  %s\n' "$hash" "$jar" | sha256sum --check
          echo "H5_BUNDLETOOL_JAR=$jar" >> "$GITHUB_ENV"
      - name: Verify approved unsigned bundle again
        env:
          GAME: ${{ inputs.game }}
          APPROVED: ${{ inputs.approved_aab_sha256 }}
        run: |
          set -euo pipefail
          aab="$(find "dist/$GAME" -name '*-unsigned.aab' -type f)"
          test "$(sha256sum "$aab" | cut -d' ' -f1)" = "$APPROVED"
          node platforms/android/validate-aab.mjs "$aab" "configs/$GAME.json" "$H5_BUNDLETOOL_JAR"
      - name: Sign approved AAB (no Play upload)
        env:
          GAME: ${{ inputs.game }}
          H5_SIGNING_MODE: upload
          H5_APPROVED_AAB_SHA256: ${{ inputs.approved_aab_sha256 }}
          H5_KEYSTORE_BASE64: ${{ secrets.H5_KEYSTORE_BASE64 }}
          H5_STORE_PASSWORD: ${{ secrets.H5_STORE_PASSWORD }}
          H5_KEY_PASSWORD: ${{ secrets.H5_KEY_PASSWORD }}
          H5_KEY_ALIAS: ${{ secrets.H5_KEY_ALIAS }}
          H5_UPLOAD_CERT_SHA256: ${{ vars.H5_UPLOAD_CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$H5_KEYSTORE_BASE64"
          test -n "$H5_STORE_PASSWORD"
          test -n "$H5_KEY_PASSWORD"
          test -n "$H5_KEY_ALIAS"
          test -n "$H5_UPLOAD_CERT_SHA256"
          temp="$(mktemp -d "$RUNNER_TEMP/upload-key.XXXXXX")"
          trap 'rm -rf "$temp"' EXIT
          export H5_KEYSTORE="$temp/upload.p12"
          printf '%s' "$H5_KEYSTORE_BASE64" | base64 --decode > "$H5_KEYSTORE"
          unset H5_KEYSTORE_BASE64
          aab="$(find "dist/$GAME" -name '*-unsigned.aab' -type f)"
          export H5_RELEASE_EVIDENCE="$(dirname "$aab")/release-evidence.json"
          node platforms/android/sign-aab.mjs "$aab"
          signed="${aab%-unsigned.aab}-upload-signed.aab"
          mkdir -p release-output
          cp "$signed" "$signed.sha256" "$signed.signing.json" "$signed.validation.json" "$H5_RELEASE_EVIDENCE" "$(dirname "$aab")/build-info.json" release-output/
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.game }}-upload-signed-${{ inputs.ci_run_id }}
          path: release-output/
          if-no-files-found: error
          retention-days: 30
