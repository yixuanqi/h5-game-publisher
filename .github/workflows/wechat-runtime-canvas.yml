name: WeChat V0.5.2b canvas contract spike
on:
  push:
    paths:
      - 'platforms/wechat/runtime/**'
      - 'tests/wechat-runtime-canvas.test.mjs'
      - '.github/workflows/wechat-runtime-canvas.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  canvas:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/wechat-runtime-canvas.test.mjs
      - uses: actions/checkout@v4
        with:
          repository: yixuanqi/PhotoGallery
          ref: cdb508594cc610733f248ec5d4123a3b9d954981
          path: upstream
          sparse-checkout: docs/ashen-bell-vow
          persist-credentials: false
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund esbuild@0.25.12 linkedom@0.18.12 @napi-rs/canvas@0.1.80
      - run: node platforms/wechat/runtime/canvas-spike.mjs upstream
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wechat-052b-canvas-spike-NOT-RELEASE
          path: .work/wechat-runtime-052b-canvas/evidence/
          if-no-files-found: warn
          retention-days: 14
